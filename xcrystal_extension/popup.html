<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XCrystal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      padding: 0;
      background: #15202B;
      color: #E7E9EA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    }

    /* 顶部导航栏 - X 风格 */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid #2F3336;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      color: #E7E9EA;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 13px;
      color: #71767B;
    }

    /* 主体内容 */
    .content {
      padding: 16px;
    }

    /* 状态栏 */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #1E2732;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F4212E;
      box-shadow: 0 0 8px rgba(244, 33, 46, 0.4);
    }

    .status-dot.connected {
      background: #00BA7C;
      box-shadow: 0 0 8px rgba(0, 186, 124, 0.4);
    }

    .status-text {
      font-size: 14px;
      color: #E7E9EA;
      font-weight: 500;
    }

    /* 设置区域 */
    .settings {
      margin-top: 0;
    }

    .setting-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4px;
    }

    .setting-group + .setting-group {
      border-top: 1px solid #2F3336;
    }

    .setting-label {
      font-size: 15px;
      color: #E7E9EA;
      font-weight: 500;
    }

    /* X 风格切换按钮组 */
    .toggle-group {
      display: flex;
      background: #1E2732;
      border-radius: 9999px;
      padding: 2px;
      gap: 2px;
    }

    .toggle-btn {
      padding: 6px 16px;
      background: transparent;
      color: #71767B;
      border: none;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      color: #E7E9EA;
    }

    .toggle-btn.active {
      background: #1D9BF0;
      color: #FFFFFF;
    }

    /* URL 输入框 */
    .url-input {
      flex: 1;
      max-width: 180px;
      padding: 6px 12px;
      background: #1E2732;
      border: 1px solid #2F3336;
      border-radius: 8px;
      color: #E7E9EA;
      font-size: 13px;
    }

    .url-input:focus {
      outline: none;
      border-color: #1D9BF0;
    }

    .url-input::placeholder {
      color: #71767B;
    }

    /* 底部说明 */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #2F3336;
    }

    .footer p {
      font-size: 12px;
      color: #71767B;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="header-icon" src="icons/icon48.png" alt="">
    <div class="header-text">
      <h1>XCrystal</h1>
      <p id="subtitle">AI 驱动的 X 加密分析</p>
    </div>
  </div>

  <div class="content">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">检查服务器...</span>
    </div>

    <div class="settings">
      <div class="setting-group">
        <span class="setting-label" id="modeLabel">分析模式</span>
        <div class="toggle-group">
          <button id="modeManual" class="toggle-btn active">手动</button>
          <button id="modeAuto" class="toggle-btn">自动</button>
        </div>
      </div>
      <div class="setting-group">
        <span class="setting-label" id="langLabel">语言</span>
        <div class="toggle-group">
          <button id="langZh" class="toggle-btn active">中文</button>
          <button id="langEn" class="toggle-btn">EN</button>
        </div>
      </div>
      <div class="setting-group">
        <span class="setting-label" id="serverLabel">服务器</span>
        <input type="text" id="serverUrl" class="url-input" placeholder="http://localhost:5678">
      </div>
    </div>
  </div>

  <div class="footer">
    <p id="modeDesc">手动模式：点击按钮分析推文</p>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
